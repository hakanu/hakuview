[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hakuview"
version = "0.1.0"
description = "Ultra-fast, lightweight IrfanView-inspired image & video viewer with instant folder cycling, crop, rotate, and slideshow for Ubuntu & Windows."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
keywords = ["hakuview", "image-viewer", "video-player", "irfanview", "pyside6", "qt6", "crop", "slideshow"]
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
hakuview = "hakuview.cli:main"

[project.gui-scripts]
hakuview-gui = "hakuview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hakuview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
