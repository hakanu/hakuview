[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hakuview"
dynamic = ["version"]
description = "Ultra-fast desktop image & video viewer with border-drag crop, floating paste & stamp mashups, pill captions, face/object blur & pixelation, CapCut-style 9:16-to-16:9 video reframe, lossless trim, and 1-click WhatsApp Web export."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
keywords = [
    "hakuview",
    "image-viewer",
    "video-player",
    "video-editor",
    "photo-editor",
    "irfanview",
    "capcut",
    "pyside6",
    "qt6",
    "ffmpeg",
    "crop",
    "blur-faces",
    "pixelate",
    "caption",
    "image-collage",
    "whatsapp-video",
    "slideshow",
]
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://hakanu.github.io/hakuview/"
Repository = "https://github.com/hakanu/hakuview"
Issues = "https://github.com/hakanu/hakuview/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
hakuview = "hakuview.cli:main"

[project.gui-scripts]
hakuview-gui = "hakuview.cli:main"

[tool.hatch.version]
# Version comes from git: a tag like v0.2.0 gives "0.2.0"; commits after it give
# "0.2.1.devN+g<hash>". Release by tagging: git tag v0.2.0 && git push --tags
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/hakuview/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hakuview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
